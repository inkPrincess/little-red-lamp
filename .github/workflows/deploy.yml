name: Deploy to Neocities

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v1
        with:
          api-token: ${{ secrets.NEOCITIES_API_KEY }}
          cleanup: true
          dist-dir: public
